name: Deploy DocC to GitHub Pages

on:
  push:
    branches: ["main", "develop", "tests-targets"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ./scripts/init.sh

      - name: Build Documentation
        run: |
          swift package --allow-writing-to-directory ./docs-out \
            generate-documentation --target Cardano \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path cardano-swift \
            --output-path ./docs-out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
