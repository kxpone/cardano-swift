name: Swift CI

on:
  push:
    branches: [ develop, main, tests-targets ]
  pull_request:
    branches: [ develop, main, tests-targets ]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Bootstrap
      run: bash scripts/init.sh
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Bootstrap
      run: bash scripts/init.sh
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  tvos:
    name: tvOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Bootstrap
      env:
        RUSTFLAGS: "-Z build-std=core,alloc,std"
      run: |
        rustup toolchain install nightly
        rustup target add --toolchain nightly aarch64-apple-tvos aarch64-apple-tvos-sim
        bash scripts/init.sh
    - name: Build tvOS
      run: |
        xcodebuild build \
          -scheme Cardano \
          -destination 'generic/platform=tvOS' \
          -sdk appletvos \
          CODE_SIGNING_ALLOWED=NO

  watchos:
    name: watchOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Bootstrap
      env:
        RUSTFLAGS: "-Z build-std=core,alloc,std"
      run: |
        rustup toolchain install nightly
        rustup target add --toolchain nightly aarch64-apple-watchos aarch64-apple-watchos-sim
        bash scripts/init.sh
    - name: Build watchOS
      run: |
        xcodebuild build \
          -scheme Cardano \
          -destination 'generic/platform=watchOS' \
          -sdk watchos \
          CODE_SIGNING_ALLOWED=NO

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Bootstrap
      run: |
        rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
        bash scripts/init.sh
    - name: Build iOS
      run: |
        xcodebuild build \
          -scheme Cardano \
          -destination 'generic/platform=iOS' \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO


